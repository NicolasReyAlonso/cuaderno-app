services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cuaderno
      POSTGRES_PASSWORD: cuaderno
      POSTGRES_DB: cuaderno
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cuaderno"]
      interval: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      CUADERNO_DATABASE_URL: postgresql+psycopg://cuaderno:cuaderno@db:5432/cuaderno
      CUADERNO_JWT_SECRET: ${CUADERNO_JWT_SECRET:-solo-para-desarrollo}
      CUADERNO_CORS_ORIGINS: '["http://localhost:8080","http://127.0.0.1:8080"]'
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
